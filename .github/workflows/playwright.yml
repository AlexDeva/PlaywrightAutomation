name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: saucedemo-chromium
            browser: chromium
          - project: saucedemo-firefox
            browser: firefox
          - project: playground-chromium
            browser: chromium
          - project: playground-firefox
            browser: firefox
          - project: api-mock-chromium
            browser: chromium
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Type check
        run: npm run typecheck

      - name: Run project
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-html-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
